# 瓜相 iOS（SwiftUI）的專案描述檔。Xcode 專案不進 repo，CI 用 XcodeGen 照這份產生（跟米說、豆鍵同一套做法）。
name: Guaxiang

options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0" # VeggieKit 從 iOS 17 起

packages:
  # 蔬菜家族共用的設定頁元件（公開 repo）
  VeggieKit:
    url: https://github.com/domyweb666/VeggieKit
    from: 1.0.0

targets:
  Guaxiang:
    type: application
    platform: iOS
    sources:
      - Guaxiang
      # 規則庫跟網頁版共用 repo 根目錄那一份，不另外抄（HANDOFF 4-3）
      - path: ../rules.json
        buildPhase: resources
    dependencies:
      - package: VeggieKit
    # Info.plist 由 XcodeGen 每次產生（不進 repo）
    info:
      path: Guaxiang/Info.plist
      properties:
        CFBundleDisplayName: 瓜相
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 只用 HTTPS，出口合規免申報
        ITSAppUsesNonExemptEncryption: false
        # 只做 iPhone 直向
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        # 相機用途要寫具體（HANDOFF 第九節）
        NSCameraUsageDescription: 用前鏡頭量臉的比例。畫面只在手機上處理，不會離開手機。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.guaxiang
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # 只給 iPhone（1）
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # DEVTOOLS：設定頁多一區開發工具（頂點對照、範例報告、自己貼金鑰）。
        # 多米要在 TestFlight 版上對頂點，所以現在兩種版本都開；上架前把這一行拿掉（.vibe/代決清單.md）。
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEVTOOLS

  GuaxiangTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GuaxiangTests
      - path: ../rules.json
        buildPhase: resources
    dependencies:
      - target: Guaxiang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.guaxiang.GuaxiangTests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Guaxiang:
    build:
      targets:
        Guaxiang: all
        GuaxiangTests: [test]
    test:
      config: Debug
      targets:
        - GuaxiangTests
